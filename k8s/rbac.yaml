# Dedicated identity for the app, with no API token mounted by default
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsecops-app
automountServiceAccountToken: false
---
# Least privilege: read-only access to pods in this namespace, nothing else
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devsecops-app-readonly
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devsecops-app-readonly
subjects:
  - kind: ServiceAccount
    name: devsecops-app
roleRef:
  kind: Role
  name: devsecops-app-readonly
  apiGroup: rbac.authorization.k8s.io
